{% extends "layout.html" %}
{% block content %}
<div class="content-section text-center py-5 position-relative overflow-hidden">
    <!-- Animated Backdrop Glow -->
    <div class="error-glow aura-404"></div>

    <div class="position-relative z-index-1">
        <!-- Animated 404 Graphic -->
        <div class="error-code-wrapper mb-3">
            <span class="error-digit float-anim">5</span>
            <div class="error-icon-orb float-anim-delayed">
                <i class="fas fa-compass-slash"></i>
            </div>
            <span class="error-digit float-anim">0</span>
        </div>

        <h2 class="font-weight-bold text-dark mb-2">Unexpected Error!</h2>
        <p class="text-muted mb-4 max-w-md mx-auto">
            Oops! Something went wrong on our end. We are looking into it, so please try again shortly.
        </p>

        <div class="d-flex justify-content-center align-items-center">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4 mr-2">
                <i class="fas fa-home mr-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock content %}
